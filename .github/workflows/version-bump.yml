name: Version Bump

# Runs on every push to main, which is what merging a pull request does.
# Running on the push instead of on the pull request event matters: a pull
# request opened from a fork only gets a read-only token, so a bump triggered
# by it could never push.
on:
  push:
    branches:
      - main

permissions:
  contents: write

# One bump at a time: two merges in a row must not compute the same version.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2
        with:
          # The latest main, not the pushed commit: a bump queued behind
          # another one must start from the version that one wrote.
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from the pushed commits
        id: bump
        env:
          # Passed through the environment, never interpolated into the
          # script: commit messages are untrusted text.
          COMMITS: ${{ toJSON(github.event.commits) }}
        run: |
          # A squash merge pushes one commit whose subject is the pull
          # request title. For a push of several commits, the largest bump
          # wins. The bump commit of this workflow starts with "chore" and so
          # never triggers another bump.
          type=none
          while IFS= read -r subject; do
            lower="$(printf '%s' "$subject" | tr '[:upper:]' '[:lower:]')"
            case "$lower" in
              feat*)
                type=minor
                ;;
              fix*)
                if [ "$type" = none ]; then
                  type=patch
                fi
                ;;
            esac
          done < <(printf '%s' "$COMMITS" | jq -r '.[].message | split("\n")[0]')
          echo "type=$type" >> "$GITHUB_OUTPUT"

      - name: Report when no version bump is required
        if: steps.bump.outputs.type == 'none'
        run: |
          echo "No pushed commit is a feature or a fix; skipping version bump."

      - name: Read current version
        if: steps.bump.outputs.type != 'none'
        id: current
        run: |
          version="$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        if: steps.bump.outputs.type != 'none'
        id: next
        run: |
          current="${{ steps.current.outputs.version }}"
          year="$(date +%Y)"
          major="$(printf '%s' "$current" | cut -d. -f1)"
          minor="$(printf '%s' "$current" | cut -d. -f2)"
          patch="$(printf '%s' "$current" | cut -d. -f3)"

          if [ "$major" != "$year" ]; then
            major="$year"
            minor=0
            patch=0
          fi

          if [ "${{ steps.bump.outputs.type }}" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new="${major}.${minor}.${patch}"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Update CMakeLists.txt
        if: steps.bump.outputs.type != 'none'
        run: |
          sed -i -E "s/VERSION ${{ steps.current.outputs.version }}/VERSION ${{ steps.next.outputs.new }}/" CMakeLists.txt

      - name: Update CHANGELOG.md
        if: steps.bump.outputs.type != 'none'
        run: |
          new="${{ steps.next.outputs.new }}"
          date="$(date +%Y-%m-%d)"
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            # What was unreleased is what this version releases: the heading
            # goes below a fresh, empty Unreleased section, above the entries.
            sed -i "0,/^## \[Unreleased\]/s//## [Unreleased]\n\n## [$new] - $date/" CHANGELOG.md
          else
            printf '\n## [%s] - %s\n' "$new" "$date" >> CHANGELOG.md
          fi

      - name: Commit version bump
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.next.outputs.new }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create release tag
        if: steps.bump.outputs.type != 'none'
        id: tag
        run: |
          tag="v${{ steps.next.outputs.new }}"
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # A tag pushed with the workflow token does not start other workflows, so
  # the release is called directly instead of waiting for the tag event.
  release:
    needs: bump
    if: needs.bump.outputs.tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.bump.outputs.tag }}
