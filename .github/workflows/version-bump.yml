name: Version Bump

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

# One bump at a time: two merges in a row must not compute the same version.
concurrency:
  group: version-bump
  cancel-in-progress: false

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump type from PR title
        id: bump
        env:
          # Passed through the environment, never interpolated into the
          # script: a PR title is untrusted text.
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          title="$PR_TITLE"
          lower="$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]')"
          case "$lower" in
            feat*)
              echo "type=minor" >> "$GITHUB_OUTPUT"
              ;;
            fix*)
              echo "type=patch" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "type=none" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Report when no version bump is required
        if: steps.bump.outputs.type == 'none'
        run: |
          echo "PR title does not indicate a feature or fix; skipping version bump."

      - name: Read current version
        if: steps.bump.outputs.type != 'none'
        id: current
        run: |
          version="$(grep -oE 'VERSION [0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt | head -1 | awk '{print $2}')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Compute new version
        if: steps.bump.outputs.type != 'none'
        id: next
        run: |
          current="${{ steps.current.outputs.version }}"
          year="$(date +%Y)"
          major="$(printf '%s' "$current" | cut -d. -f1)"
          minor="$(printf '%s' "$current" | cut -d. -f2)"
          patch="$(printf '%s' "$current" | cut -d. -f3)"

          if [ "$major" != "$year" ]; then
            major="$year"
            minor=0
            patch=0
          fi

          if [ "${{ steps.bump.outputs.type }}" = "minor" ]; then
            minor=$((minor + 1))
            patch=0
          else
            patch=$((patch + 1))
          fi

          new="${major}.${minor}.${patch}"
          echo "new=$new" >> "$GITHUB_OUTPUT"

      - name: Update CMakeLists.txt
        if: steps.bump.outputs.type != 'none'
        run: |
          sed -i -E "s/VERSION ${{ steps.current.outputs.version }}/VERSION ${{ steps.next.outputs.new }}/" CMakeLists.txt

      - name: Update CHANGELOG.md
        if: steps.bump.outputs.type != 'none'
        run: |
          new="${{ steps.next.outputs.new }}"
          date="$(date +%Y-%m-%d)"
          if grep -q '^## \[Unreleased\]' CHANGELOG.md; then
            # What was unreleased is what this version releases: the heading
            # goes below a fresh, empty Unreleased section, above the entries.
            sed -i "0,/^## \[Unreleased\]/s//## [Unreleased]\n\n## [$new] - $date/" CHANGELOG.md
          else
            printf '\n## [%s] - %s\n' "$new" "$date" >> CHANGELOG.md
          fi

      - name: Commit version bump
        if: steps.bump.outputs.type != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CMakeLists.txt CHANGELOG.md
          git commit -m "chore: bump version to ${{ steps.next.outputs.new }}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Create release tag
        if: steps.bump.outputs.type != 'none'
        run: |
          git tag "v${{ steps.next.outputs.new }}"
          git push origin "v${{ steps.next.outputs.new }}"
